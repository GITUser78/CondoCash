name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: Unit (browser)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Ensure a browser is available
        run: |
          if ! command -v firefox >/dev/null && ! command -v firefox-esr >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq firefox-esr
          fi
          browser="$(command -v firefox || command -v firefox-esr)"
          "$browser" --version

      - name: Unit tests
        run: python3 tests/unit/run_unit.py

  integration:
    name: Integration (local Supabase)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install the Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # Brings up Postgres, GoTrue and PostgREST in Docker and applies
      # supabase/migrations — so the tests run against this branch's schema,
      # never against a hosted project holding real data.
      - name: Start the local stack
        run: supabase start

      - name: Export the local credentials
        run: |
          supabase status -o json > /tmp/supabase-status.json
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json
          s = {k.lower(): v for k, v in json.load(open("/tmp/supabase-status.json")).items()}
          print("SUPABASE_URL=" + s.get("api_url", "http://127.0.0.1:54321"))
          print("SUPABASE_ANON_KEY=" + s["anon_key"])
          print("SUPABASE_SERVICE_ROLE_KEY=" + s["service_role_key"])
          PY

      - name: Integration tests
        run: python3 tests/integration/test_api.py

      - name: Stop the local stack
        if: always()
        run: supabase stop --no-backup
